<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HN by domain</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<h1>Hacker News top posts by domain</h1>
<form id="f">
  <label>Domain: <input id="domain" value="wikipedia.org" size="20"></label>
  <label>Stories: <input id="count" type="number" min="1" max="1000" value="50" size="5"></label>
  <button type="submit">Load</button>
  <span id="status"></span>
</form>
<a href="#" id="hideReadLink" class="toggleLink">[hide read]</a>
<a href="#" id="hideUnreadLink" class="toggleLink">[hide unread]</a>
<a href="#" id="hideLikedLink" class="toggleLink">[hide liked]</a>
<ul id="list"></ul>
<script>
const list = document.getElementById('list');
const status = document.getElementById('status');
const form = document.getElementById('f');
const domainInput = document.getElementById('domain');
const countInput = document.getElementById('count');
const hideReadLink = document.getElementById('hideReadLink');
const hideUnreadLink = document.getElementById('hideUnreadLink');
const hideLikedLink = document.getElementById('hideLikedLink');

let lastStories = null;
let lastDomain = null;

const rerender = () => { if (lastStories) render(lastStories, lastDomain); };

const makeToggle = (link, word, storageKey) => {
  const get = () => localStorage.getItem(storageKey) === 'true';
  const set = (v) => localStorage.setItem(storageKey, v ? 'true' : 'false');
  const update = () => { link.textContent = get() ? '[show ' + word + ']' : '[hide ' + word + ']'; };
  link.addEventListener('click', (e) => {
    e.preventDefault();
    set(!get());
    update();
    rerender();
  });
  update();
  return get;
};

const isHideRead = makeToggle(hideReadLink, 'read', 'hn-hide-read');
const isHideUnread = makeToggle(hideUnreadLink, 'unread', 'hn-hide-unread');
const isHideLiked = makeToggle(hideLikedLink, 'liked', 'hn-hide-liked');

const readKey = (d) => 'hn-reads:' + d;
const qualityKey = (d) => 'hn-quality:' + d;
const clickedKey = (d) => 'hn-clicked:' + d;
const getFlags = (key, d) => { try { return JSON.parse(localStorage.getItem(key(d))) || {}; } catch { return {}; } };
const setFlag = (key, d, id, v) => {
  const r = getFlags(key, d);
  if (v) r[id] = true; else delete r[id];
  localStorage.setItem(key(d), JSON.stringify(r));
};

function render(stories, domain) {
  const reads = getFlags(readKey, domain);
  const qualityFlags = getFlags(qualityKey, domain);
  const clickedFlags = getFlags(clickedKey, domain);
  const hideRead = isHideRead();
  const hideUnread = isHideUnread();
  const hideLiked = isHideLiked();
  list.innerHTML = '';
  for (const s of stories) {
    if (hideRead && reads[s.id] && !qualityFlags[s.id]) continue;
    if (hideUnread && !reads[s.id]) continue;
    if (hideLiked && qualityFlags[s.id]) continue;
    const li = document.createElement('li');
    const row = document.createElement('div');
    row.className = 'row';
    const clearClicked = () => {
      setFlag(clickedKey, domain, s.id, false);
      li.classList.remove('clicked');
    };
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!reads[s.id];
    cb.addEventListener('change', () => {
      setFlag(readKey, domain, s.id, cb.checked);
      li.classList.toggle('read', cb.checked);
      if (cb.checked) clearClicked();
      if (isHideRead()) rerender();
    });
    const qbtn = document.createElement('button');
    qbtn.type = 'button';
    qbtn.className = 'quality';
    qbtn.title = 'high quality';
    qbtn.textContent = '👍';
    qbtn.setAttribute('aria-pressed', String(!!qualityFlags[s.id]));
    qbtn.addEventListener('click', () => {
      const on = qbtn.getAttribute('aria-pressed') !== 'true';
      setFlag(qualityKey, domain, s.id, on);
      qbtn.setAttribute('aria-pressed', String(on));
      li.classList.toggle('quality', on);
      if (on) clearClicked();
      if (on && !cb.checked) {
        cb.checked = true;
        setFlag(readKey, domain, s.id, true);
        li.classList.add('read');
      }
      if (isHideRead()) rerender();
    });
    const pts = document.createElement('a');
    pts.className = 'pts';
    pts.href = 'https://news.ycombinator.com/item?id=' + s.id;
    pts.textContent = s.points;
    pts.rel = 'noreferrer';
    const title = document.createElement('span');
    title.className = 'title';
    const a = document.createElement('a');
    a.href = s.url;
    a.textContent = s.title;
    a.rel = 'noreferrer';
    a.addEventListener('click', () => {
      setFlag(clickedKey, domain, s.id, true);
      li.classList.add('clicked');
    });
    title.appendChild(a);
    let year = null;
    if (s.year) {
      year = document.createElement('span');
      year.className = 'year';
      year.textContent = '[' + s.year + ']';
    }
    const dom = document.createElement('span');
    dom.className = 'dom';
    dom.textContent = '(' + s.domain + ')';
    row.append(cb, qbtn, pts, title, dom);
    if (year) title.before(year);
    li.appendChild(row);
    if (cb.checked) li.classList.add('read');
    if (qbtn.getAttribute('aria-pressed') === 'true') li.classList.add('quality');
    if (clickedFlags[s.id]) li.classList.add('clicked');
    list.appendChild(li);
  }
}

async function load() {
  const domain = domainInput.value.trim() || 'wikipedia.org';
  const count = countInput.value || 50;
  try {
    const resp = await fetch(`/api/stories?domain=${encodeURIComponent(domain)}&count=${encodeURIComponent(count)}`);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const stories = await resp.json();
    lastStories = stories;
    lastDomain = domain;
    render(stories, domain);
  } catch (e) {
    status.textContent = 'error: ' + e.message;
    list.innerHTML = '';
  }
}

form.addEventListener('submit', (e) => { e.preventDefault(); load(); });
load();
</script>
</body>
</html>
