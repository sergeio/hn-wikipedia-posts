<style>
:root { color-scheme: dark; }
body {
  --bg: #1b1b1f; --fg: #ddd;
  --muted: #999; --dim: #888; --dimmer: #8f8f8f;
  --link: #ddd; --link-hover: #aaa;
  --read-link: #5f5f5f; --read-pts: #4a4a4a;
  --quality-link: #d9b44a; --quality-pts: #b0912f;
  --outline: #888; --control-bg: #2a2a30; --control-border: #444; --placeholder: #888;
}
body.light {
  --bg: #f6f6ef; --fg: #000;
  --muted: #666; --dim: #a8a8a8; --dimmer: #828282;
  --link: #000; --link-hover: #000;
  --read-link: #b0b0b0; --read-pts: #d4d4d4;
  --quality-link: #7a5c00; --quality-pts: #a08a00;
  --outline: #555; --control-bg: #fff; --control-border: #bbb; --placeholder: #999;
  color-scheme: light;
}
body { font-family: Verdana, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 1rem; position: relative; }
h1 { font-size: 1.2rem; }
form { margin-bottom: 0.25rem; }
input, button { font-size: 1rem; padding: 0.25rem; background: var(--control-bg); color: var(--fg); border: 1px solid var(--control-border); border-radius: 3px; }
input::placeholder { color: var(--placeholder); }
#f input, #f button { font-size: 0.8rem; padding: 0.05rem 0.15rem; }
#status { margin-left: 0.5rem; color: var(--muted); font-size: 0.8rem; }
ul { list-style: none; padding: 0; max-width: 50rem; }
li { margin-bottom: 0.4rem; }
.row { display: flex; align-items: baseline; gap: 0.5rem; }
.pts { color: var(--dim); font-size: 0.8rem; min-width: 2rem; text-align: right; }
input[type="checkbox"] { accent-color: #999; opacity: 0.55; }
input[type="checkbox"]:hover { opacity: 1; }
.year { color: var(--dimmer); font-size: 0.75rem; }
a.pts { text-decoration: none; }
a.pts:hover { text-decoration: underline; color: var(--link-hover); }
.title a { color: var(--link); text-decoration: none; }
.title a:hover { text-decoration: underline; }
li.read .title a { color: var(--read-link); text-decoration: line-through; }
li.read .pts { color: var(--read-pts); }
li.quality .title a { color: var(--quality-link); text-decoration: underline; }
li.quality .pts { color: var(--quality-pts); }
button.quality {
  background: none; border: none; padding: 0;
  font-size: 0.9rem; cursor: pointer; opacity: 0.35;
  filter: grayscale(1);
}
button.quality:hover { opacity: 0.8; }
button.quality[aria-pressed="true"] { opacity: 1; filter: none; }
li.clicked .row { outline: 2px dashed var(--outline); outline-offset: 3px; padding: 3px; }
.toggleLink { display: inline-block; margin: 0.25rem 0.25rem 0.5rem 0; font-size: 0.8rem; color: var(--muted); text-decoration: none; }
.toggleLink:hover { text-decoration: underline; }
#themeLink { position: absolute; top: 1rem; right: 1rem; }
</style>
</head>

<script>
const list = document.getElementById('list');
const status = document.getElementById('status');
const form = document.getElementById('f');
const domainInput = document.getElementById('domain');
const countInput = document.getElementById('count');
const hideReadLink = document.getElementById('hideReadLink');
const hideUnreadLink = document.getElementById('hideUnreadLink');
const hideLikedLink = document.getElementById('hideLikedLink');
const themeLink = document.getElementById('themeLink');

const THEME_KEY = 'hn-theme';
const applyTheme = () => {
  const light = localStorage.getItem(THEME_KEY) === 'light';
  document.body.classList.toggle('light', light);
  themeLink.textContent = light ? '[dark]' : '[light]';
};
themeLink.addEventListener('click', (e) => {
  e.preventDefault();
  localStorage.setItem(THEME_KEY, document.body.classList.contains('light') ? 'dark' : 'light');
  applyTheme();
});
applyTheme();

const API_BASE = 'https://hn.algolia.com/api/v1/search';
const CACHE_TTL = 30 * 86400 * 1000;
const FILTERED_TITLE_RES = [
  /\bhas died\b/i,
  /wikip|wikimedia/i,
];

let lastStories = null;
let lastDomain = null;

const rerender = () => { if (lastStories) render(lastStories, lastDomain); };

const makeToggle = (link, word, storageKey) => {
  const get = () => localStorage.getItem(storageKey) === 'true';
  const set = (v) => localStorage.setItem(storageKey, v ? 'true' : 'false');
  const update = () => { link.textContent = get() ? '[show ' + word + ']' : '[hide ' + word + ']'; };
  link.addEventListener('click', (e) => {
    e.preventDefault();
    set(!get());
    update();
    rerender();
  });
  update();
  return get;
};

const isHideRead = makeToggle(hideReadLink, 'read', 'hn-hide-read');
const isHideUnread = makeToggle(hideUnreadLink, 'unread', 'hn-hide-unread');
const isHideLiked = makeToggle(hideLikedLink, 'liked', 'hn-hide-liked');

const readKey = (d) => 'hn-reads:' + d;
const qualityKey = (d) => 'hn-quality:' + d;
const clickedKey = (d) => 'hn-clicked:' + d;
const getFlags = (key, d) => { try { return JSON.parse(localStorage.getItem(key(d))) || {}; } catch { return {}; } };
const setFlag = (key, d, id, v) => {
  const r = getFlags(key, d);
  if (v) r[id] = true; else delete r[id];
  localStorage.setItem(key(d), JSON.stringify(r));
};

function normalizeDomain(raw) {
  raw = raw.trim().toLowerCase().replace(/^https?:\/\//, '').split('/')[0].split('?')[0];
  if (!/^[a-z0-9.-]+\.[a-z]{2,}$/.test(raw)) throw new Error('invalid domain');
  return raw;
}

const isFiltered = (title) => FILTERED_TITLE_RES.some((rx) => rx.test(title));

const cacheKey = (d) => 'hn-cache:' + d;
const readCache = (d) => {
  try {
    const data = JSON.parse(localStorage.getItem(cacheKey(d)));
    return data && typeof data === 'object' && Array.isArray(data.hits) ? data : null;
  } catch { return null; }
};
const writeCache = (d, hits) => {
  try {
    localStorage.setItem(cacheKey(d), JSON.stringify({ fetched_at: Date.now(), hits }));
  } catch {}
};

async function fetchStories(domain, count) {
  if (domain === 'wikipedia.org' && typeof EMBEDDED_WIKIPEDIA !== 'undefined') {
    const stories = EMBEDDED_WIKIPEDIA.slice(0, count).map((h) => ({
      id: h.i, title: h.t, points: h.p, url: h.u, year: h.y,
    }));
    return { stories, fromCache: true, builtIn: true };
  }
  const cached = readCache(domain);
  if (cached && Date.now() - cached.fetched_at < CACHE_TTL && cached.hits.length >= count) {
    return { stories: cached.hits.slice(0, count), fromCache: true };
  }
  try {
    const url = API_BASE + '?' + new URLSearchParams({
      tags: 'story',
      restrictSearchableAttributes: 'url',
      query: domain,
      hitsPerPage: '1000',
    });
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    let hits = (data.hits || []).map((h) => ({
      id: h.objectID,
      title: h.title || h.story_title || '(untitled)',
      points: h.points || 0,
      url: h.url || 'https://news.ycombinator.com/item?id=' + h.objectID,
      domain: (h.url && h.url.includes('://')) ? h.url.split('/')[2] : domain,
      year: (h.created_at || '').slice(0, 4),
    }));
    hits = hits.filter((h) => !isFiltered(h.title));
    hits.sort((a, b) => b.points - a.points);
    if (domain !== 'wikipedia.org') writeCache(domain, hits);
    return { stories: hits.slice(0, count), fromCache: false };
  } catch (e) {
    if (cached) return { stories: cached.hits.slice(0, count), fromCache: true };
    throw e;
  }
}

function render(stories, domain) {
  const reads = getFlags(readKey, domain);
  const qualityFlags = getFlags(qualityKey, domain);
  const clickedFlags = getFlags(clickedKey, domain);
  const hideRead = isHideRead();
  const hideUnread = isHideUnread();
  const hideLiked = isHideLiked();
  list.innerHTML = '';
  for (const s of stories) {
    if (hideRead && reads[s.id] && !qualityFlags[s.id]) continue;
    if (hideUnread && !reads[s.id]) continue;
    if (hideLiked && qualityFlags[s.id]) continue;
    const li = document.createElement('li');
    const row = document.createElement('div');
    row.className = 'row';
    const clearClicked = () => {
      setFlag(clickedKey, domain, s.id, false);
      li.classList.remove('clicked');
    };
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!reads[s.id];
    cb.addEventListener('change', () => {
      setFlag(readKey, domain, s.id, cb.checked);
      li.classList.toggle('read', cb.checked);
      if (cb.checked) clearClicked();
      if (isHideRead()) rerender();
    });
    const qbtn = document.createElement('button');
    qbtn.type = 'button';
    qbtn.className = 'quality';
    qbtn.title = 'high quality';
    qbtn.textContent = '👍';
    qbtn.setAttribute('aria-pressed', String(!!qualityFlags[s.id]));
    qbtn.addEventListener('click', () => {
      const on = qbtn.getAttribute('aria-pressed') !== 'true';
      setFlag(qualityKey, domain, s.id, on);
      qbtn.setAttribute('aria-pressed', String(on));
      li.classList.toggle('quality', on);
      if (on) clearClicked();
      if (on && !cb.checked) {
        cb.checked = true;
        setFlag(readKey, domain, s.id, true);
        li.classList.add('read');
      }
      if (isHideRead()) rerender();
    });
    const pts = document.createElement('a');
    pts.className = 'pts';
    pts.href = 'https://news.ycombinator.com/item?id=' + s.id;
    pts.textContent = s.points;
    pts.rel = 'noreferrer';
    const title = document.createElement('span');
    title.className = 'title';
    const a = document.createElement('a');
    a.href = s.url;
    a.textContent = s.title;
    a.rel = 'noreferrer';
    const markClicked = () => {
      if (reads[s.id] || qualityFlags[s.id]) return;
      setFlag(clickedKey, domain, s.id, true);
      li.classList.add('clicked');
    };
    a.addEventListener('click', markClicked);
    a.addEventListener('auxclick', (e) => {
      if (e.button !== 1) return;
      markClicked();
    });
    title.appendChild(a);
    let year = null;
    if (s.year) {
      year = document.createElement('span');
      year.className = 'year';
      year.textContent = '[' + s.year + ']';
    }
    row.append(cb, qbtn, pts, title);
    if (year) title.before(year);
    li.appendChild(row);
    if (cb.checked) li.classList.add('read');
    if (qbtn.getAttribute('aria-pressed') === 'true') li.classList.add('quality');
    if (clickedFlags[s.id]) li.classList.add('clicked');
    list.appendChild(li);
  }
}

async function load() {
  const count = countInput.value || 150;
  let domain;
  try {
    domain = normalizeDomain(domainInput.value || 'wikipedia.org');
  } catch (e) {
    status.textContent = 'error: ' + e.message;
    list.innerHTML = '';
    return;
  }
  try {
    const { stories, fromCache, builtIn } = await fetchStories(domain, count);
    lastStories = stories;
    lastDomain = domain;
    status.textContent = builtIn ? '(built-in, HN data as of ' + WIKI_DATA_CUTOFF + ')'
                     : fromCache ? '(cached)' : '';
    render(stories, domain);
  } catch (e) {
    status.textContent = 'error: ' + e.message;
    list.innerHTML = '';
  }
}

form.addEventListener('submit', (e) => { e.preventDefault(); load(); });
load();
</script>
